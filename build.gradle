plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.0'
}

group = 'assets.recipehandler'
version = modVersion

base {
    archivesName = 'NoMoreRecipeConflict'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

minecraft {
    mcVersion = minecraftVersion
    mcpMappingChannel = mappingChannel
    mcpMappingVersion = mappingVersion
}

dependencies {
    implementation "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

sourceSets {
    main {
        java {
            srcDir '.'
            include 'assets/recipehandler/**/*.java'
        }
        resources {
            srcDir '.'
            include 'assets/recipehandler/lang/**/*.lang'
            include 'mcmod.info'
            include 'pack.mcmeta'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraftVersion
    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: minecraftVersion
    }
}

jar {
    includeEmptyDirs = false
    archiveClassifier = "(${minecraftVersion})"
}
