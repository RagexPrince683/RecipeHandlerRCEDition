# Project identity
modName = NoMoreRecipeConflict
modId = recipehandler
modGroup = assets.recipehandler
modVersion = 0.3
customArchiveBaseName = NoMoreRecipeConflict

# Minecraft, Forge, and MCP mappings
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# GTNH convention settings
gtnh.settings.blowdryerTag = 0.2.2
gtnh.modules.codeStyle = false
autoUpdateBuildScript = false
includeWellKnownRepositories = true

# Java compilation and source transformation
enableModernJavaSyntax = false
enableGenericInjection = true
generateGradleTokenClass = assets.recipehandler.Tags
gradleTokenVersion = VERSION

# Optional convention features not used by this mod
usesMixins = false
usesShadowedDependencies = false
usesMavenPublishing = false
accessTransformersFile =
coreModClass =
apiPackage =
mixinPlugin =
mixinConfig =

# Gradle runtime
org.gradle.jvmargs = -Xmx2G
org.gradle.daemon = false
